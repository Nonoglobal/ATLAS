<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>I AM MORE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #080808;
  --bg2:   #121212;
  --bg3:   #1c1c1c;
  --red:   #8B1A1A;
  --red2:  #B82020;
  --red3:  #D42222;
  --glow:  rgba(180,30,30,0.5);
  --glow2: rgba(180,30,30,0.15);
  --white: #ffffff;
  --gray:  #777777;
  --gray2: #333333;
  --fh:    'Orbitron', monospace;
  --fb:    'Rajdhani', sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--fb);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── LOADER ───────────────────────────── */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  transition: opacity .6s ease;
}
#loader.fade { opacity: 0; pointer-events: none; }

.loader-title {
  font-family: var(--fh);
  font-size: clamp(1.4rem, 6vw, 2.2rem);
  font-weight: 900;
  letter-spacing: .45em;
  color: var(--white);
  text-shadow: 0 0 30px var(--glow);
}
.loader-bar-wrap {
  width: min(260px, 70vw);
  height: 2px;
  background: var(--gray2);
  border-radius: 2px;
  overflow: hidden;
}
.loader-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--red), var(--red3));
  border-radius: 2px;
  box-shadow: 0 0 8px var(--glow);
  transition: width .4s ease;
}
.loader-status {
  font-family: var(--fh);
  font-size: .55rem;
  letter-spacing: .35em;
  color: var(--gray);
  text-transform: uppercase;
}

/* ── APP ──────────────────────────────── */
#app {
  opacity: 0;
  transition: opacity .5s ease;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 14px 40px;
}
#app.show { opacity: 1; }

/* ── HEADER ───────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 10px;
  border-bottom: 1px solid var(--red);
  margin-bottom: 20px;
}
.app-title {
  font-family: var(--fh);
  font-size: clamp(.8rem, 3.5vw, 1rem);
  font-weight: 900;
  letter-spacing: .45em;
  color: var(--red3);
  text-shadow: 0 0 14px var(--glow);
}
.fb-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: .6rem;
  letter-spacing: .15em;
  color: var(--gray);
  font-family: var(--fh);
}
.fb-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gray2);
  transition: background .3s, box-shadow .3s;
}
.fb-dot.on { background: #2dca72; box-shadow: 0 0 6px #2dca72; }

/* ── CLOCK ────────────────────────────── */
.clock-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 24px;
}
.clock-svg-wrap {
  width:  min(88vw, 380px);
  height: min(88vw, 380px);
  filter: drop-shadow(0 0 22px var(--glow));
}
.clock-svg { width: 100%; height: 100%; }

.digital {
  font-family: var(--fh);
  font-size: clamp(1.6rem, 7vw, 2.4rem);
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--white);
  text-align: center;
  margin-top: 10px;
  text-shadow: 0 0 14px var(--glow);
}
.date-line {
  font-size: .72rem;
  letter-spacing: .28em;
  color: var(--gray);
  text-align: center;
  margin-top: 4px;
  text-transform: uppercase;
}

/* ── DIVIDER ──────────────────────────── */
.div {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  margin: 16px 0;
}

/* ── ACTIVITY BUTTONS ─────────────────── */
.act-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 0;
}
.act-btn {
  background: var(--bg3);
  border: 1px solid var(--gray2);
  border-radius: 5px;
  padding: 16px 10px 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
  transition: background .15s, border-color .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.act-btn:active { transform: scale(.97); }
.act-btn.active {
  border-color: var(--red3);
  background: rgba(139,26,26,.2);
  box-shadow: 0 0 18px var(--glow2);
}
.act-btn.active::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 5px;
  border: 1px solid var(--red3);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

.act-led {
  position: absolute;
  top: 7px; right: 8px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gray2);
}
.act-btn.active .act-led {
  background: var(--red3);
  box-shadow: 0 0 5px var(--red3);
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

.act-icon { font-size: 1.9rem; line-height: 1; }
.act-name {
  font-family: var(--fh);
  font-size: .55rem;
  letter-spacing: .25em;
  color: var(--gray);
  text-transform: uppercase;
}
.act-btn.active .act-name { color: var(--white); }

/* ── ACTIVE TIMERS ────────────────────── */
#activeStrip {
  display: none;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
#activeStrip.show { display: flex; }

.active-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(139,26,26,.12);
  border: 1px solid var(--red);
  border-radius: 4px;
  padding: 8px 12px;
}
.active-ic { font-size: 1.1rem; }
.active-name {
  font-family: var(--fh);
  font-size: .6rem;
  letter-spacing: .2em;
  color: var(--white);
  flex: 1;
}
.active-dur {
  font-family: var(--fh);
  font-size: .8rem;
  color: var(--red3);
  letter-spacing: .05em;
}

/* ── LOG ──────────────────────────────── */
.log-wrap {
  max-height: 320px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.log-wrap::-webkit-scrollbar { width: 3px; }
.log-wrap::-webkit-scrollbar-track { background: var(--bg2); }
.log-wrap::-webkit-scrollbar-thumb { background: var(--red); border-radius: 2px; }

.log-empty {
  text-align: center;
  color: var(--gray2);
  font-size: .8rem;
  letter-spacing: .2em;
  padding: 20px;
  border: 1px dashed var(--gray2);
  border-radius: 4px;
}
.log-card {
  background: var(--bg3);
  border: 1px solid var(--gray2);
  border-left: 3px solid var(--red);
  border-radius: 4px;
  padding: 9px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slideIn .2s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }

.lc-icon { font-size: 1.2rem; flex-shrink:0; }
.lc-info { flex:1; min-width:0; }
.lc-name {
  font-family: var(--fh);
  font-size: .58rem;
  letter-spacing: .18em;
  color: var(--white);
}
.lc-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 2px;
  font-size: .76rem;
  color: var(--gray);
}
.lc-dur { color: var(--red2); font-weight: 700; }
.lc-emoji { font-size: 1.1rem; flex-shrink:0; }
.lc-arrow {
  color: var(--red2);
  opacity: .7;
  cursor: pointer;
  flex-shrink:0;
  font-size: 1.1rem;
  padding: 4px;
  transition: opacity .2s;
}
.lc-arrow:hover { opacity:1; }

/* ── MODALS ───────────────────────────── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.overlay.show { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--red);
  border-radius: 6px;
  padding: 22px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 0 40px var(--glow);
}
.m-sub  { font-family:var(--fh); font-size:.58rem; letter-spacing:.3em; color:var(--gray); text-transform:uppercase; margin-bottom:3px; }
.m-act  { font-family:var(--fh); font-size:1.1rem; letter-spacing:.1em; color:var(--red3); margin-bottom:4px; }
.m-dur  { font-size:.82rem; color:var(--gray); margin-bottom:18px; }
.m-lbl  { font-family:var(--fh); font-size:.55rem; letter-spacing:.3em; color:var(--gray); text-transform:uppercase; margin-bottom:9px; }

.rate-grid {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.rate-btn {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background: var(--bg3);
  border: 1px solid var(--gray2);
  border-radius: 4px;
  padding: 7px 3px;
  cursor: pointer;
  transition: all .12s;
  -webkit-tap-highlight-color: transparent;
}
.rate-btn:hover, .rate-btn.sel {
  border-color: var(--red3);
  background: rgba(139,26,26,.25);
  transform: scale(1.06);
}
.r-emoji { font-size: 1.3rem; line-height:1; }
.r-num   { font-family:var(--fh); font-size:.48rem; color:var(--gray); }

.m-btn {
  width:100%;
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: 4px;
  padding: 11px;
  font-family: var(--fh);
  font-size: .62rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .2s;
}
.m-btn:hover { background: var(--red3); }
.m-btn.sec   { background: var(--bg3); }
.m-row       { display:flex; gap:8px; }

.detail-body {
  font-size:.85rem;
  color:var(--gray);
  line-height:2;
  margin-bottom:16px;
}
.detail-body strong { color:var(--white); }

/* ── CORNERS ──────────────────────────── */
.c { position:fixed; width:24px; height:24px; pointer-events:none; opacity:.2; z-index:5; }
.c-tl { top:8px; left:8px;   border-top:2px solid var(--red3); border-left:2px solid var(--red3); }
.c-tr { top:8px; right:8px;  border-top:2px solid var(--red3); border-right:2px solid var(--red3); }
.c-bl { bottom:8px; left:8px;  border-bottom:2px solid var(--red3); border-left:2px solid var(--red3); }
.c-br { bottom:8px; right:8px; border-bottom:2px solid var(--red3); border-right:2px solid var(--red3); }
</style>
</head>
<body>

<div class="c c-tl"></div><div class="c c-tr"></div>
<div class="c c-bl"></div><div class="c c-br"></div>

<!-- LOADER -->
<div id="loader">
  <div class="loader-title">I AM MORE</div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>

</div>

<!-- RATING MODAL -->
<div class="overlay" id="rateOverlay">

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════

const FB = {
  apiKey:            "AIzaSyBzrEOAFybuVPsfqYp9gaYsypTib50VcD8",
  authDomain:        "objek-3d3fa.firebaseapp.com",
  databaseURL:       "https://objek-3d3fa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "objek-3d3fa",
  storageBucket:     "objek-3d3fa.firebasestorage.app",
  messagingSenderId: "838823739880",
  appId:             "1:838823739880:web:49b09e58dae09ff19d645d"
};

const DB_PATH = 'iammore/v1';

// ═══════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════

const ACTS = {
  fitness:  { icon:'⚡', name:'FITNESS'  },
  business: { icon:'💼', name:'BUSINESS' },
  school:   { icon:'🎯', name:'SCHOOL'   },
  sleep:    { icon:'🌙', name:'SLEEP'    }
};
const EMOJIS   = ['😭','😢','😞','😟','😐','🙂','😊','😀','😄','🤩'];
const DAYS     = ['SONNTAG','MONTAG','DIENSTAG','MITTWOCH','DONNERSTAG','FREITAG','SAMSTAG'];
const MONTHS   = ['JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];
const CX=150, CY=150, R=135;

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════

let state   = { active:{}, log:[] };
let db      = null;
let pending = null;
let selRate = null;

// ═══════════════════════════════════
// BOOT / LOADER
// ═══════════════════════════════════

function setLoader(pct, txt) {
  document.getElementById('loaderBar').style.width    = pct + '%';
  document.getElementById('loaderStatus').textContent = txt;
}

async function boot() {
  setLoader(10, 'VERBINDE MIT FIREBASE…');

  await loadScript('https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js');
  setLoader(40, 'SDK GELADEN…');

  await loadScript('https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js');
  setLoader(65, 'DATENBANK VERBINDEN…');

  try {
    if (!window.firebase.apps.length) window.firebase.initializeApp(FB);
    db = window.firebase.database();
    await firstSync();
    setLoader(95, 'BEREIT');
  } catch(e) {
    setLoader(95, 'OFFLINE — LOKALE DATEN');
    const raw = localStorage.getItem('iam_state');
    if (raw) try { state = JSON.parse(raw); } catch(_){}
  }

  await sleep(400);

  buildClockFace();
  buildRateGrid();
  renderActs();
  renderLog();
  startLive();

  const loader = document.getElementById('loader');
  loader.classList.add('fade');
  setTimeout(() => { loader.style.display = 'none'; }, 650);
  document.getElementById('app').classList.add('show');
}

function firstSync() {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), 5000);
    db.ref(DB_PATH).once('value', snap => {
      clearTimeout(timer);
      const data = snap.val();
      if (data) {
        state = data;
        if (!state.active) state.active = {};
        if (!state.log)    state.log    = [];
      } else {
        save();
      }
      // Now listen for real-time updates
      db.ref(DB_PATH).on('value', onDbUpdate);
      setFbStatus(true);
      resolve();
    }, err => {
      clearTimeout(timer);
      reject(err);
    });
  });
}

function onDbUpdate(snap) {
  const data = snap.val();
  if (!data) return;
  state = data;
  if (!state.active) state.active = {};
  if (!state.log)    state.log    = [];
  renderActs();
  renderLog();
  setFbStatus(true);
}

function setFbStatus(online) {
  const dot   = document.getElementById('fbDot');
  const label = document.getElementById('fbLabel');
  dot.className   = 'fb-dot' + (online ? ' on' : '');
  label.textContent = online ? 'LIVE' : 'OFFLINE';
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload  = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════
// PERSIST
// ═══════════════════════════════════

function save() {
  localStorage.setItem('iam_state', JSON.stringify(state));
  if (db) db.ref(DB_PATH).set(state).catch(() => setFbStatus(false));
}

// ═══════════════════════════════════
// CLOCK
// ═══════════════════════════════════

function buildClockFace() {
  const minG = document.getElementById('minMarkers');
  const hrG  = document.getElementById('hrMarkers');

  for (let i=0; i<60; i++) {
    if (i%5===0) continue;
    const a  = (i/60)*2*Math.PI - Math.PI/2;
    const x1 = CX + R*Math.cos(a),     y1 = CY + R*Math.sin(a);
    const x2 = CX + (R-6)*Math.cos(a), y2 = CY + (R-6)*Math.sin(a);
    minG.appendChild(mkLine(x1,y1,x2,y2,'#222','1'));
  }

  for (let h=0; h<24; h++) {
    const a      = (h/24)*2*Math.PI - Math.PI/2;
    const major  = h%6===0;
    const quarter= h%3===0;
    const inner  = major ? R-20 : quarter ? R-13 : R-8;
    const stroke = major ? '#8B1A1A' : quarter ? '#333' : '#242424';
    const sw     = major ? '2.5' : quarter ? '1.5' : '1';
    hrG.appendChild(mkLine(
      CX+R*Math.cos(a),     CY+R*Math.sin(a),
      CX+inner*Math.cos(a), CY+inner*Math.sin(a),
      stroke, sw
    ));
    if (major || quarter) {
      const lr = major ? R-32 : R-24;
      hrG.appendChild(mkTxt(
        CX + lr*Math.cos(a),
        CY + lr*Math.sin(a) + 3.5,
        h===0?'0':String(h),
        major ? 12 : 8,
        major ? '#C41E1E' : '#3a3a3a'
      ));
    }
  }
}

function mkLine(x1,y1,x2,y2,stroke,sw) {
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',sw);
  return l;
}
function mkTxt(x,y,txt,sz,fill) {
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('text-anchor','middle');
  t.setAttribute('font-family','Orbitron');
  t.setAttribute('font-size',sz);
  t.setAttribute('font-weight','700');
  t.setAttribute('fill',fill);
  t.textContent = txt;
  return t;
}

function startLive() {
  requestAnimationFrame(clockLoop);
  setInterval(timerTick, 1000);
}

function clockLoop() {
  const n  = new Date();
  const h=n.getHours(), m=n.getMinutes(), s=n.getSeconds(), ms=n.getMilliseconds();
  setHand('scHand', (s+ms/1000)/60*360);
  setHand('mnHand', (m+(s+ms/1000)/60)/60*360);
  setHand('hrHand', (h+m/60+s/3600)/24*360);
  document.getElementById('digitalTime').textContent = p2(h)+':'+p2(m)+':'+p2(s);
  document.getElementById('dateLine').textContent =
    DAYS[n.getDay()]+' · '+p2(n.getDate())+' '+MONTHS[n.getMonth()]+' '+n.getFullYear();
  requestAnimationFrame(clockLoop);
}
function setHand(id, angle) {
  document.getElementById(id).setAttribute('transform',`translate(${CX},${CY}) rotate(${angle})`);
}
function p2(n) { return String(n).padStart(2,'0'); }

// ═══════════════════════════════════
// ACTIVITIES
// ═══════════════════════════════════

function toggleAct(key) {
  if (state.active[key]) {
    const start = state.active[key].start;
    const end   = Date.now();
    pending = { key, start, end, dur: end-start };
    showRate(key, pending.dur);
  } else {
    state.active[key] = { start: Date.now() };
    save();
    renderActs();
  }
}

function renderActs() {
  Object.keys(ACTS).forEach(k => {
    document.getElementById('btn-'+k).classList.toggle('active', !!state.active[k]);
  });
  renderActiveStrip();
}

function timerTick() {
  renderActiveStrip();
}

function renderActiveStrip() {
  const strip = document.getElementById('activeStrip');
  strip.innerHTML = '';
  const keys = Object.keys(state.active || {});
  if (keys.length === 0) { strip.classList.remove('show'); return; }
  strip.classList.add('show');
  const now = Date.now();
  keys.forEach(k => {
    const cfg = ACTS[k];
    if (!cfg) return;
    const row = document.createElement('div');
    row.className = 'active-row';
    row.innerHTML =
      `<span class="active-ic">${cfg.icon}</span>` +
      `<span class="active-name">${cfg.name}</span>` +
      `<span class="active-dur">${fmtDur(now - state.active[k].start)}</span>`;
    strip.appendChild(row);
  });
}

function fmtDur(ms) {
  const ts = Math.floor(ms/1000);
  const h  = Math.floor(ts/3600);
  const m  = Math.floor((ts%3600)/60);
  const s  = ts%60;
  if (h>0) return h+'h '+p2(m)+'m';
  if (m>0) return m+'m '+p2(s)+'s';
  return s+'s';
}

// ═══════════════════════════════════
// RATING
// ═══════════════════════════════════

function buildRateGrid() {
  const g = document.getElementById('rateGrid');
  EMOJIS.forEach((e,i) => {
    const b = document.createElement('button');
    b.className = 'rate-btn';
    b.innerHTML = `<span class="r-emoji">${e}</span><span class="r-num">${i+1}</span>`;
    b.onclick = () => { selRate=i+1; document.querySelectorAll('.rate-btn').forEach((x,j)=>x.classList.toggle('sel',j===i)); };
    g.appendChild(b);
  });
}

function showRate(key, dur) {
  selRate = null;
  document.querySelectorAll('.rate-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('mActName').textContent = ACTS[key].name;
  document.getElementById('mDur').textContent     = 'Dauer: '+fmtDur(dur);
  document.getElementById('rateOverlay').classList.add('show');
}

document.getElementById('confirmBtn').onclick = function() {
  if (!selRate) {
    const g=document.getElementById('rateGrid');
    g.style.opacity='.3'; setTimeout(()=>g.style.opacity='1',220);
    return;
  }
  const {key,start,end,dur} = pending;
  const entry = {
    id: Date.now(), key, start, end, dur, rating: selRate,
    ds: new Date(end).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}),
    ts: new Date(end).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})
  };
  state.log.unshift(entry);
  if (state.log.length > 100) state.log.pop();
  delete state.active[key];
  save();
  renderActs();
  renderLog();
  document.getElementById('rateOverlay').classList.remove('show');
  pending = null;
};

// ═══════════════════════════════════
// LOG
// ═══════════════════════════════════

function renderLog() {
  const wrap  = document.getElementById('logWrap');
  const empty = document.getElementById('logEmpty');
  wrap.querySelectorAll('.log-card').forEach(c=>c.remove());
  if (!state.log || state.log.length===0) { empty.style.display='block'; return; }
  empty.style.display = 'none';
  state.log.forEach(e => {
    const cfg = ACTS[e.key]; if (!cfg) return;
    const card = document.createElement('div');
    card.className = 'log-card';
    card.innerHTML =
      `<div class="lc-icon">${cfg.icon}</div>` +
      `<div class="lc-info">` +
        `<div class="lc-name">${cfg.name}</div>` +
        `<div class="lc-meta"><span class="lc-dur">${fmtDur(e.dur)}</span><span>${e.ds} ${e.ts}</span></div>` +
      `</div>` +
      `<div class="lc-emoji">${EMOJIS[e.rating-1]}</div>` +
      `<div class="lc-arrow" onclick="showDetail(${e.id})">›</div>`;
    wrap.appendChild(card);
  });
}

function showDetail(id) {
  const e   = state.log.find(x=>x.id===id); if(!e) return;
  const cfg = ACTS[e.key];
  const s   = new Date(e.start).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const en  = new Date(e.end).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dActName').textContent = cfg.icon+' '+cfg.name;
  document.getElementById('dBody').innerHTML =
    `<strong>Datum:</strong> ${e.ds}<br><strong>Start:</strong> ${s}<br>` +
    `<strong>Ende:</strong> ${en}<br><strong>Dauer:</strong> ${fmtDur(e.dur)}<br>` +
    `<strong>Bewertung:</strong> ${e.rating}/10 ${EMOJIS[e.rating-1]}`;
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('show'); }

// ═══════════════════════════════════
// GO
// ═══════════════════════════════════

boot();
</script>
